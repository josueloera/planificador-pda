name: Test macOS ad hoc package repair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
        tag: [v1.0.11]
        signing: [original, adhoc]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Download and mount original DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          mkdir -p evidence unpacked
          gh release download "$RELEASE_TAG" --repo josueloera/planificador-pda --pattern '*universal.dmg' --dir download
          shasum -a 256 download/*.dmg > evidence/dmg-sha256.txt
          hdiutil attach download/*.dmg -readonly -nobrowse -mountpoint "$PWD/mounted"
          ditto "$PWD/mounted/Planificador Docente Secundaria.app" "$PWD/unpacked/Planificador Docente Secundaria.app"
          hdiutil detach "$PWD/mounted"
      - name: Apply complete local signature
        if: matrix.signing == 'adhoc'
        shell: bash
        run: |
          node - <<'JS'
          const { signAsync } = require('@electron/osx-sign');
          signAsync({app: process.cwd() + '/unpacked/Planificador Docente Secundaria.app', identity:'-', identityValidation:false, platform:'darwin', preAutoEntitlements:false, preEmbedProvisioningProfile:false, gatekeeperAssess:false, optionsForFile:()=>({hardenedRuntime:false})}).catch(e=>{console.error(e);process.exitCode=1;});
          JS
          codesign --verify --deep --strict --verbose=4 'unpacked/Planificador Docente Secundaria.app'
      - name: Inspect Gatekeeper and startup
        shell: bash
        run: |
          export APP="$PWD/unpacked/Planificador Docente Secundaria.app"
          sw_vers > evidence/platform.txt
          uname -m >> evidence/platform.txt
          codesign -d --verbose=4 "$APP" > evidence/signature.txt 2>&1 || true
          codesign --verify --deep --strict --verbose=4 "$APP" >> evidence/signature.txt 2>&1 || true
          spctl --assess --type execute --verbose=4 "$APP" > evidence/gatekeeper.txt 2>&1 || true
          find "$APP/Contents/Resources" -name node_sqlite3.node -exec file {} \; > evidence/sqlite.txt
          python3 - <<'PY'
          import os,subprocess,time,json,urllib.request,pathlib,plistlib
          app=os.environ['APP']
          with open(app+'/Contents/Info.plist','rb') as f: info=plistlib.load(f)
          executable=app+'/Contents/MacOS/'+info['CFBundleExecutable']
          quarantine='0083;'+format(int(time.time()),'x')+';Safari;'
          subprocess.run(['xattr','-w','com.apple.quarantine',quarantine,app],check=True)
          try:
            opened=subprocess.run(['open','-n',app],capture_output=True,text=True,timeout=15)
            pathlib.Path('evidence/quarantine-open.txt').write_text('exit='+str(opened.returncode)+'\n'+opened.stdout+opened.stderr)
          except subprocess.TimeoutExpired:
            pathlib.Path('evidence/quarantine-open.txt').write_text('open waited for user interaction for 15 seconds; runtime test continues separately')
          time.sleep(10)
          subprocess.run(['screencapture','-x','evidence/quarantine-screen.png'],capture_output=True)
          # Only remove the synthetic quarantine on the disposable CI copy for the separate runtime test.
          subprocess.run(['xattr','-d','com.apple.quarantine',app],capture_output=True)
          env=dict(os.environ,ELECTRON_RUN_AS_NODE='1')
          arch='arm64' if os.uname().machine=='arm64' else 'x64'
          base=pathlib.Path(app+'/Contents/Resources')
          candidates=[base/('app-'+arch)/'node_modules/sqlite3',base/'app/node_modules/sqlite3',base/'app.asar/node_modules/sqlite3']
          sqlite=next((p for p in candidates if p.exists()),candidates[-1])
          try:
            check=subprocess.run([executable,'-e','const s=require(process.argv[1]); const db=new s.Database(":memory:"); db.get("select 1 as ok",(e,r)=>{console.log(e||r);db.close();if(e)process.exitCode=1;});',str(sqlite)],env=env,capture_output=True,text=True,timeout=40)
            code=check.returncode
            pathlib.Path('evidence/sqlite-runtime.txt').write_text('exit='+str(code)+'\n'+check.stdout+check.stderr)
          except Exception as e:
            code=-999;pathlib.Path('evidence/sqlite-runtime.txt').write_text(str(e))
          with open('evidence/startup.txt','w') as log:
            child=subprocess.Popen([executable,'--remote-debugging-port=9229','--enable-logging=stderr'],stdout=log,stderr=subprocess.STDOUT)
            targets=[]
            for _ in range(30):
              if child.poll() is not None:break
              try:
                with urllib.request.urlopen('http://127.0.0.1:9229/json/list',timeout=1) as response:targets=json.load(response)
              except Exception:pass
              time.sleep(1)
            result={'version':info.get('CFBundleShortVersionString'),'architecture':arch,'sqliteExit':code,'processExit':child.poll(),'targets':targets}
            pathlib.Path('evidence/result.json').write_text(json.dumps(result,indent=2))
            subprocess.run(['screencapture','-x','evidence/screen.png'],capture_output=True)
            if child.poll() is None:
              child.terminate()
              try:child.wait(timeout=10)
              except subprocess.TimeoutExpired:child.kill();child.wait()
          print(json.dumps(result,indent=2))
          if code or not any(t.get('type')=='page' and t.get('url','').startswith('file:') for t in targets):raise SystemExit('Startup check failed; inspect evidence')
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-${{ matrix.signing }}-${{ matrix.runner }}
          path: evidence
      - name: Package verified manual installer
        if: success() && matrix.signing == 'adhoc' && matrix.runner == 'macos-14'
        shell: bash
        run: |
          mkdir -p manual-installer
          ln -s /Applications unpacked/Applications
          codesign --verify --deep --strict 'unpacked/Planificador Docente Secundaria.app'
          hdiutil create -volname 'Planificador Secundaria' -srcfolder unpacked -ov -format UDZO manual-installer/Planificador-Secundaria-1.0.11-firma-local-universal.dmg
          shasum -a 256 manual-installer/*.dmg > manual-installer/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: success() && matrix.signing == 'adhoc' && matrix.runner == 'macos-14'
        with:
          name: manual-mac-installer
          path: manual-installer
