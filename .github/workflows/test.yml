name: Diagnose macOS 1.0.10 startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Download published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh release download v1.0.10 --repo josueloera/planificador-pda --pattern '*universal.zip' --dir download
          ditto -x -k download/*.zip unpacked
      - name: Inspect and launch published app
        shell: bash
        run: |
          APP="$PWD/unpacked/Planificador Docente Secundaria.app"
          export APP
          sw_vers > evidence/platform.txt
          uname -m >> evidence/platform.txt
          codesign -d --verbose=4 "$APP" > evidence/signature.txt 2>&1 || true
          codesign --verify --deep --strict --verbose=4 "$APP" >> evidence/signature.txt 2>&1 || true
          spctl --assess --type execute --verbose=4 "$APP" > evidence/gatekeeper.txt 2>&1 || true
          find "$APP/Contents/Resources" -name node_sqlite3.node -exec file {} \; > evidence/sqlite.txt
          python3 - <<'PY'
          import os,subprocess,time,json,urllib.request,pathlib
          app=os.environ['APP']
          executable=app+'/Contents/MacOS/Planificador Docente Secundaria'
          env=dict(os.environ,ELECTRON_RUN_AS_NODE='1')
          arch='arm64' if os.uname().machine=='arm64' else 'x64'
          sqlite=app+'/Contents/Resources/app-'+arch+'/node_modules/sqlite3'
          check=subprocess.run([executable,'-e','const s=require(process.argv[1]); const db=new s.Database(":memory:"); db.get("select 1 as ok",(e,r)=>{console.log(e||r);db.close();if(e)process.exitCode=1;});',sqlite],env=env,capture_output=True,text=True,timeout=40)
          pathlib.Path('evidence/sqlite-runtime.txt').write_text('exit='+str(check.returncode)+'\n'+check.stdout+check.stderr)
          with open('evidence/startup.txt','w') as log:
            child=subprocess.Popen([executable,'--remote-debugging-port=9229','--enable-logging=stderr'],stdout=log,stderr=subprocess.STDOUT)
            targets=[]
            for _ in range(30):
              if child.poll() is not None:break
              try:
                with urllib.request.urlopen('http://127.0.0.1:9229/json/list',timeout=1) as response:targets=json.load(response)
              except Exception:pass
              time.sleep(1)
            result={'architecture':arch,'sqliteExit':check.returncode,'processExit':child.poll(),'targets':targets}
            pathlib.Path('evidence/result.json').write_text(json.dumps(result,indent=2))
            subprocess.run(['screencapture','-x','evidence/screen.png'],capture_output=True)
            if child.poll() is None:
              child.terminate()
              try:child.wait(timeout=10)
              except subprocess.TimeoutExpired:child.kill();child.wait()
          print(json.dumps(result,indent=2))
          if check.returncode or not any(t.get('type')=='page' and t.get('url','').startswith('file:') for t in targets):raise SystemExit('Startup check failed; inspect evidence')
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-diagnostic-${{ matrix.runner }}
          path: evidence
