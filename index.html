<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elara Secundaria</title>
    <script>window.__ELARA_PLANNER_VARIANT__ = "secundaria";</script>
    <script>
      try {
        const { ipcRenderer } = require('electron');
        const origLog = console.log;
        const origError = console.error;
        console.log = function(...args) {
          origLog.apply(console, args);
          ipcRenderer.send('log-to-file', '[INFO] ' + args.map(a => a instanceof Error ? (a.stack || (a.name + ': ' + a.message)) : typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
        };
        console.error = function(...args) {
          origError.apply(console, args);
          ipcRenderer.send('log-to-file', '[ERROR] ' + args.map(a => a instanceof Error ? (a.stack || (a.name + ': ' + a.message)) : typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
        };
        window.addEventListener('error', event => ipcRenderer.send('log-to-file', '[WINDOW ERROR] ' + (event.error?.stack || event.message)));
        window.addEventListener('unhandledrejection', event => { const reason = event.reason; ipcRenderer.send('log-to-file', '[UNHANDLED REJECTION] ' + (reason instanceof Error ? (reason.stack || reason.message) : String(reason))); });
      } catch(e) {}

    </script>
  <link rel="icon" href="./elara-icon.png" /></head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
